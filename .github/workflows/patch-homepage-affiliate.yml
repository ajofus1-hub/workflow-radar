name: Verify Workflow Radar production build

on:
  push:
    branches: ["growth/*"]
    paths:
      - ".github/workflows/patch-homepage-affiliate.yml"

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reconstruct the exact Render source and build it
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/source"
          cat workflow-radar.tar.gz.part* > "$tmp/workflow-radar.tar.gz"
          tar -tzf "$tmp/workflow-radar.tar.gz" >/dev/null
          cp -a . "$tmp/source/"
          tar -xzf "$tmp/workflow-radar.tar.gz" -C "$tmp/source"
          test -f "$tmp/source/app/package.json"
          test -f "$tmp/source/app/src/routes/index.tsx"
          grep -q 'Affiliate link: We may earn a commission' "$tmp/source/app/src/routes/index.tsx"
          grep -q 'Try Systeme.io free' "$tmp/source/app/src/routes/index.tsx"
          grep -q 'sa=sa0286089660ebed8476e8d7899489bd8eb71bc507&tk=workflow-radar-directory' "$tmp/source/app/src/routes/index.tsx"
          cd "$tmp/source/app"
          bun install --frozen-lockfile
          bun run build
          echo "BUILD_VERIFIED=PASS"
          echo "HOMEPAGE_SOURCE=app/src/routes/index.tsx"
          echo "TRACKING_ID_AND_SUBID=PRESERVED"
          echo "DISCLOSURE_AND_CTA=PRESENT"
