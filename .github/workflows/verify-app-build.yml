name: Verify Workflow Radar production build

on:
  push:
    branches:
      - main
      - "growth/**"
    paths:
      - "app/src/**"
      - "app/public/**"
      - "workflow-radar.tar.gz.part*"
      - ".github/workflows/verify-app-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reconstruct application source
        shell: bash
        run: |
          cat workflow-radar.tar.gz.part* | tar -xz

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build production app
        working-directory: app
        run: bun run build
